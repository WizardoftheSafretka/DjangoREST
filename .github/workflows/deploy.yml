name: Django CI/CD

on:
  push:
    branches: [ develop, main, feature/homework ]


jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: django-insecure-ci-test-key
        DEBUG: False
      run: |
        python manage.py migrate

    - name: Run tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: django-insecure-ci-test-key
        DEBUG: False
        REDIS_URL: redis://localhost:6379/0
      run: |
        python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🚀 Начинаем деплой..."
          
          # Установка системных пакетов
          echo "📦 Устанавливаем системные пакеты..."
          sudo apt update
          sudo apt install python3-venv python3-pip git -y
          
          # Создание директории
          if [ ! -d "/var/www/your-project" ]; then
            echo "📁 Создаем директорию..."
            sudo mkdir -p /var/www/your-project
            sudo chown -R $USER:$USER /var/www/your-project
          fi
          
          cd /var/www/your-project
          
          # Клонирование или обновление из ветки develop
          if [ ! -d ".git" ]; then
            echo "📥 Клонируем репозиторий (ветка develop)..."
            git clone -b develop https://github.com/${{ github.repository }} .
          else
            echo "🔄 Обновляем код из ветки develop..."
            git fetch origin
            git checkout develop
            git pull origin develop
          fi
          
          # Проверяем наличие файлов
          echo "📂 Содержимое директории:"
          ls -la
          
          if [ ! -f "requirements.txt" ]; then
            echo "❌ Файл requirements.txt не найден!"
            exit 1
          fi
          
          # Виртуальное окружение
          if [ ! -d "venv" ]; then
            echo "🐍 Создаем виртуальное окружение..."
            python3 -m venv venv
          fi
          
          echo "📦 Устанавливаем зависимости..."
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
          echo "🗄️ Выполняем миграции..."
          python manage.py migrate
          
          echo "📁 Собираем статику..."
          python manage.py collectstatic --noinput
          
          echo "🔄 Перезапускаем сервисы..."
          sudo systemctl restart gunicorn
          sudo systemctl reload nginx
          
          echo "✅ Деплой успешно завершен!"
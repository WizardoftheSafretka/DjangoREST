name: Django CI/CD

on:
  push:
    branches: [ develop, main, feature/homework ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        NAME: test_db
        USER: postgres
        PASSWORD: postgres
        HOST: localhost
        PORT: 5432
        DJANGO_SETTINGS_MODULE: config.settings
        SECRET_KEY: django-insecure-ci-test-key
        DEBUG: False
      run: |
        python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest


    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get branch name
      id: branch
      run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🚀 Начинаем деплой из ветки ${{ steps.branch.outputs.BRANCH_NAME }}..."
          
          cd /var/www/your-project
          
          # Обновляем код из текущей ветки
          git fetch origin
          git checkout ${{ steps.branch.outputs.BRANCH_NAME }}
          git pull origin ${{ steps.branch.outputs.BRANCH_NAME }}
          
          # Установка зависимостей
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # Загружаем переменные из .env
          set -a
          source .env
          set +a
          
          # Миграции
          echo "🗄️ Выполняем миграции..."
          python manage.py migrate
          
          # Статика
          echo "📁 Собираем статику..."
          python manage.py collectstatic --noinput
          
          # Перезапуск
          echo "🔄 Перезапускаем сервисы..."
          sudo systemctl restart gunicorn
          sudo systemctl reload nginx
          
          echo "✅ Деплой успешно завершен!"